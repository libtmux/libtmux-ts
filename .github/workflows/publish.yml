name: publish

# Tag the workspace, not a package: every package carries the same version and
# is released together, whether or not each one changed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing: npm mints its credential from this token, so no
  # NODE_AUTH_TOKEN exists to leak or rotate.
  id-token: write

concurrency:
  group: publish
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Install canaries execute the tarballs on the supported Node floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Record the Node 22 install-canary path
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      # Publishing is npm's, not Bun's: trusted publishing needs npm CLI
      # 11.5.1 or later, which detects the OIDC environment on its own.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # `cd`, not `bun --cwd`: that flag does not exist, and bun answers an
      # unknown flag with its usage text and exit code 0 — so every step passed
      # while doing nothing, and the first release shipped a package with no
      # dist in it.
      - name: Build and check every package
        run: |
          for package in libtmux mcp workspace; do
            ( cd "packages/$package" && bun run test:package && bun run test:install )
          done

      - name: Coordinate release
        run: bun scripts/publish-release.ts
