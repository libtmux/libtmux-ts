name: publish

# Tag the workspace, not a package: every package carries the same version and
# is released together, whether or not each one changed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  queue: max

jobs:
  # A same-repository workflow call resolves from this run's commit. Publishing
  # waits for that exact tree to pass the supported Bun lanes and the oldest and
  # newest released tmux; workflow_dispatch with scope=full runs the whole table.
  verify:
    uses: ./.github/workflows/typescript.yml
    with:
      scope: edges

  publish:
    needs: verify
    permissions:
      contents: read
      # Trusted publishing: npm mints its credential from this token, so no
      # NODE_AUTH_TOKEN exists to leak or rotate.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      # Install canaries execute the tarballs on the supported Node floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Record the Node 22 install-canary path
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      - name: Provision pnpm and Yarn for install canaries
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          COREPACK_ENABLE_STRICT: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-bin"
          "$(dirname "$LIBTMUX_NODE22")/corepack" enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm yarn
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/corepack-bin/pnpm" --version && "$RUNNER_TEMP/corepack-bin/yarn" --version)
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"

      # Publishing is npm's, not Bun's: trusted publishing needs npm CLI
      # 11.5.1 or later, which detects the OIDC environment on its own.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # The workspace CLI's install canary drives its Python bridge, which
      # refuses an interpreter without this exact tmuxp.
      - name: Create the workspace Python environment
        run: python3 -m venv "$RUNNER_TEMP/workspace-python"

      - name: Install tmuxp 1.74.0 in it
        run: $RUNNER_TEMP/workspace-python/bin/pip install tmuxp==1.74.0

      - name: Point the workspace CLI at the workspace Python
        run: echo "TMUX_WORKSPACE_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"

      # `working-directory`, not `bun --cwd`: that flag does not exist, and bun
      # answers an unknown flag with its usage text and exit code 0 — so every
      # step passed while doing nothing, and the first release shipped a package
      # with no dist in it.
      - name: Check the packed libtmux
        working-directory: packages/libtmux
        run: bun run test:package

      - name: Install the packed libtmux
        working-directory: packages/libtmux
        run: bun run test:install

      - name: Check the packed @libtmux/mcp
        working-directory: packages/mcp
        run: bun run test:package

      - name: Install the packed @libtmux/mcp
        working-directory: packages/mcp
        run: bun run test:install

      - name: Check the packed @libtmux/workspace
        working-directory: packages/workspace
        run: bun run test:package

      - name: Install the packed @libtmux/workspace
        working-directory: packages/workspace
        run: bun run test:install

      - name: Check the packed @libtmux/workspace-cli
        working-directory: packages/workspace-cli
        run: bun run test:package

      - name: Install the packed @libtmux/workspace-cli
        working-directory: packages/workspace-cli
        run: bun run test:install

      - name: Coordinate release
        run: bun scripts/publish-release/publish-release.ts
