name: typescript

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not depend on which tmux is installed. Split out
  # because it used to run once per tmux release: a lint rule and a doc link do
  # not become truer on 3.5 than on 3.2a, and paying for them per version is
  # what kept the version matrix down to a sample of the range it claims.
  gates:
    name: Gates (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    # Runtime compatibility crosses every package, example and executed document.
    # Keep that axis complete while the tmux job below varies only tmux.
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.14", "1.4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # The emitted-Node lane refuses to substitute the runner's default Node,
      # so the floor is provisioned rather than assumed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Point the emitted-Node lane at the provisioned Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      # One tmux, because the suites below start servers; which one they start
      # is the version job's question. The floor, so nothing here can depend on
      # something newer without the version job saying so.
      - name: Setup tmux build cache for tmux 3.2a
        id: tmux-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/tmux-builds/tmux-3.2a
          key: tmux-3.2a

      - name: Build tmux 3.2a
        if: steps.tmux-build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install libevent-dev libncurses5-dev libtinfo-dev libutempter-dev bison
          mkdir -p ~/tmux-builds ~/tmux-src
          git clone https://github.com/tmux/tmux.git ~/tmux-src/tmux-3.2a
          cd ~/tmux-src/tmux-3.2a
          git checkout 3.2a
          sh autogen.sh
          ./configure --prefix=$HOME/tmux-builds/tmux-3.2a && make && make install

      - run: echo "$HOME/tmux-builds/tmux-3.2a/bin" >> "$GITHUB_PATH"
      - run: tmux -V

      # A shell the MCP server's framing deliberately cannot address, which is
      # the only way to prove it refuses one. The suite names it rather than
      # skipping without it.
      - name: Install fish
        run: sudo apt-get install -y fish

      - run: bun install --frozen-lockfile

      # Formatting, linting and the cross-package READMEs are the workspace's,
      # not any one package's.
      - run: bun run format:check
      - run: bun run lint
      # The gates below are themselves TypeScript, and until this ran nothing
      # compiled them: a gate that crashes on its own type error reports no
      # failures, which reads exactly like a clean tree.
      - run: bun run typecheck:tooling
      - run: bun run typecheck:readme
      # The prose around the compiled snippets: that every link resolves, and
      # that the shell blocks name paths and packages this workspace has.
      - run: bun run docs:links
      - run: bun run docs:claims
      - run: bun run docs:runnable
      # Compiling a snippet proves it typechecks; only running it proves the
      # target exists and the recipe terminates. This starts real tmux servers,
      # so it also has to leave none behind, and it says so if it does.
      - run: bun run --cwd packages/libtmux test:readme
      # Compiling the example on every public symbol proved it typechecks and
      # never once ran it; a one-liner that reads a property is still a claim
      # about what that property answers.
      - run: bun run --cwd packages/libtmux test:symbols
      # Every temporary directory the suites create is named for this
      # package, so a sweep can never reap another libtmux port's servers.
      - run: bun run test:namespace
      # dependabot is the one configuration nothing else here executes, so a
      # placeholder in it reads exactly like a working one until a dependency
      # has been stale for a year.
      - run: bun run ci:config

      - name: Gate the library
        working-directory: packages/libtmux
        run: |
          bun run lint:unused
          bun run typecheck
          bun run typecheck:readme
          bun run typecheck:symbols
          bun run docs:api:check
          bun run docs:criteria:check
          bun run generate:check
          bun run parity
          bun run build

      # Everything below needs the emitted declarations the build just made:
      # the ambient-free consumer, the fixture that imports the package by
      # name, and the packaging checks.
      - name: Gate the emitted package
        working-directory: packages/libtmux
        run: |
          bun run typecheck:ambient-free
          bun run typecheck:tooling
          bun run test:package
          # Packing and linting the tarball is not installing it. The two
          # releases this repository shipped broken — one with no dist, one
          # whose install command 404'd — both packed clean.
          bun run test:install

      - name: Test the library
        working-directory: packages/libtmux
        run: |
          bun run test:types
          bun run test:node
          # Both suites in one run, because they cover different things: a
          # pane's methods are proven against a real server, so a floor
          # measured on the unit suite alone would push work towards mocking
          # one. This runs them, so `test:unit` is not run separately here.
          bun run test:coverage

      # In-repo consumers prove the published surface is enough to build on.
      # `test:package` runs here and not only at publish: the packaging
      # mistakes this repository actually shipped were in the consumers, and a
      # gate that only runs while releasing finds them after the release.
      - name: Gate the MCP server
        working-directory: packages/mcp
        run: bun run typecheck && bun run test && bun run test:package && bun run test:install

      - name: Gate the workspace builder
        working-directory: packages/workspace
        run: bun run typecheck && bun run test && bun run test:package && bun run test:install

      # The recipes above the library package, reaching across it to the
      # workspace builder and the MCP server. After those gates because each
      # runs from inside the package that owns its document, so an import means
      # what a reader's would — including what those steps just emitted.
      - run: bun run test:docs

      # One step for all of them. Each example is a package of its own now, and
      # the umbrella typechecks and runs every sibling — so adding an example
      # does not mean remembering to add a step here.
      - name: Gate the examples
        working-directory: examples
        run: bun run typecheck && bun run test

  # The real-server supervisor below still depends on Linux `/proc`. This lane
  # proves the platform-neutral package boundary on macOS without claiming that
  # cancellation and process ownership have crossed that boundary yet.
  macos-package:
    name: macOS package canary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Point installed-package canaries at Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Gate the emitted library package
        working-directory: packages/libtmux
        run: |
          bun run typecheck
          bun run build
          bun run typecheck:ambient-free
          bun run test:package
          bun run test:install

      - name: Gate the emitted MCP package
        working-directory: packages/mcp
        run: bun run test:package && bun run test:install

      - name: Gate the emitted workspace package
        working-directory: packages/workspace
        run: bun run test:package && bun run test:install

  # Every tmux release the package claims to support, not a sample of them.
  # "3.2a or newer" is a claim about 3.3a, 3.5 and 3.6 too, and a matrix of the
  # ends and two favourites proves it for none of them — 3.7 already turned out
  # to be the one release that accepts `break-pane -n` and ignores it.
  #
  # The library's suites only: the consumers are thin over it, so a tmux
  # difference they could hit is one its own suites hit first, and running them
  # once per release buys a repeat rather than a reading.
  tmux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmux-version: ["3.2a", "3.3a", "3.4", "3.5", "3.6", "3.7", "3.7a", "3.7b", "3.7c"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Point the emitted-Node lane at the provisioned Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      # The differential corpus compares this port against the pinned Python
      # release, which it runs through uv.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # The oracle runs the real library rather than a description of it, so
      # unlike the parity baseline this needs the code. The tag is what the
      # materialized tree is authenticated against, so a shallow clone of it
      # carries everything the comparison needs.
      - name: Check out libtmux 0.62.0 for the differential oracle
        run: |
          git clone --branch v0.62.0 --depth 1 \
            https://github.com/tmux-python/libtmux.git "$RUNNER_TEMP/libtmux-python"
          echo "LIBTMUX_PYTHON_REPO=$RUNNER_TEMP/libtmux-python" >> "$GITHUB_ENV"

      # Resolve and install the oracle's environment once, here. Left to the
      # suite, the first oracle call pays for it inside a test's deadline and
      # fails on a cold cache while later calls pass on a warm one.
      - name: Warm the oracle environment
        run: uv sync --project "$RUNNER_TEMP/libtmux-python"

      - name: Setup tmux build cache for tmux ${{ matrix.tmux-version }}
        id: tmux-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/tmux-builds/tmux-${{ matrix.tmux-version }}
          key: tmux-${{ matrix.tmux-version }}

      - name: Build tmux ${{ matrix.tmux-version }}
        if: steps.tmux-build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install libevent-dev libncurses5-dev libtinfo-dev libutempter-dev bison
          mkdir -p ~/tmux-builds ~/tmux-src
          git clone https://github.com/tmux/tmux.git ~/tmux-src/tmux-${{ matrix.tmux-version }}
          cd ~/tmux-src/tmux-${{ matrix.tmux-version }}
          git checkout ${{ matrix.tmux-version }}
          sh autogen.sh
          ./configure --prefix=$HOME/tmux-builds/tmux-${{ matrix.tmux-version }} && make && make install

      - name: Use tmux ${{ matrix.tmux-version }}
        run: |
          echo "$HOME/tmux-builds/tmux-${{ matrix.tmux-version }}/bin" >> "$GITHUB_PATH"

      - run: tmux -V

      - run: bun install --frozen-lockfile

      - name: Build the library
        working-directory: packages/libtmux
        run: bun run build

      # What a tmux release can actually change: the commands, the formats, and
      # what the Python oracle says the same call should do.
      - name: Exercise this tmux
        working-directory: packages/libtmux
        run: |
          bun run test:integration
          bun run test:differential
