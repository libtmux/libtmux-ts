name: typescript

# A push or pull request runs the oldest and the newest released tmux. A call
# from the publish workflow, and a dispatch with scope=full, run the whole
# table. scripts/plan-ci.ts decides, from .github/ci-matrix.txt, and every tmux
# lane below takes its matrix from that plan.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      # A release proves every lane, so the publish workflow asks for them all
      # and never inherits the edges.
      scope:
        description: edges runs the oldest and newest tmux, full the whole table
        type: string
        default: full
  workflow_dispatch:
    inputs:
      scope:
        description: edges runs the oldest and newest tmux, full the whole table, custom the tmux-ref list
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: With scope=custom, comma-separated tmux versions, tags, branches or commits
        type: string
        default: ""
      bun:
        description: Comma-separated Bun versions; empty runs the normal ones
        type: string
        default: ""
      os:
        description: Runner image for the gates and tmux jobs
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-latest
      tmate:
        description: Open a tmate session on the one tmux lane, which needs a single tmux-ref
        type: choice
        options: ["off", before-tests, on-failure]
        default: "off"

permissions:
  contents: read

# A dispatch is a request for that run, so its run id keeps one from cancelling
# another or the push run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tmux: ${{ steps.plan.outputs.tmux }}
      bun-versions: ${{ steps.plan.outputs.bun-versions }}
      os: ${{ steps.plan.outputs.os }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Inputs reach the script through the environment, never inline.
      - name: Plan the tmux lanes
        id: plan
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_TMUX_REF: ${{ inputs.tmux-ref }}
          INPUT_BUN: ${{ inputs.bun }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_TMATE: ${{ inputs.tmate }}
        run: bun scripts/plan-ci.ts

  # One check to require. A job the plan left out of scope may be skipped; every
  # other job has to have passed. Matrices shrink through the plan, not through
  # an `if` on a matrix leg, so a skipped leg cannot read as a pass.
  required:
    name: required
    if: ${{ always() }}
    needs: [plan, gates, tmux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Require every planned job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ needs.plan.outputs.skip }}
        run: bun scripts/plan-ci.ts verify

  # Everything that does not depend on which tmux is installed. Split out
  # because it used to run once per tmux release: a lint rule and a doc link do
  # not become truer on 3.5 than on 3.3a, and paying for them per version is
  # what kept the version matrix down to a sample of the range it claims.
  gates:
    name: Gates (Bun ${{ matrix.bun-version }})
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    timeout-minutes: 15
    # Runtime compatibility crosses every package, example and executed document.
    # Keep that axis complete while the tmux job below varies only tmux.
    strategy:
      fail-fast: false
      matrix:
        bun-version: ${{ fromJSON(needs.plan.outputs.bun-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # The emitted-Node lane refuses to substitute the runner's default Node,
      # so the floor is provisioned rather than assumed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Point the emitted-Node lane at the provisioned Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      # One tmux, because the suites below start servers; which one they start
      # is the version job's question. 3.8, because the documented examples
      # drive control mode and `runShell` output, which need 3.7 and 3.5; the
      # floor and each release between are the version job's.
      - name: Build tmux 3.8
        id: tmux
        uses: ./.github/actions/build-tmux
        with:
          ref: "3.8"

      - run: echo "$TMUX_PREFIX/bin" >> "$GITHUB_PATH"
        env:
          TMUX_PREFIX: ${{ steps.tmux.outputs.prefix }}
      - run: tmux -V

      # fish proves non-POSIX-shell refusal; zsh exercises trap preservation.
      - name: Install test shells
        run: sudo apt-get install -y fish zsh

      - run: bun install --frozen-lockfile

      - name: Install the optional workspace Python test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/workspace-python"
          "$RUNNER_TEMP/workspace-python/bin/python" -m pip install 'tmuxp==1.74.0'
          echo "LIBTMUX_TEST_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"
          echo "TMUX_WORKSPACE_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"

      # Formatting, linting and the cross-package READMEs are the workspace's,
      # not any one package's.
      - run: bun run format:check
      - run: bun run lint
      # The gates below are themselves TypeScript, and until this ran nothing
      # compiled them: a gate that crashes on its own type error reports no
      # failures, which reads exactly like a clean tree.
      - run: bun run typecheck:tooling
      - run: bun run typecheck:readme
      - run: bun run --cwd packages/workspace-cli build
      # The prose around the compiled snippets: that every doc comment reaches
      # a symbol, that every link resolves, and that the shell blocks name
      # paths and packages this workspace has.
      - run: bun run docs:comments
      - run: bun run docs:links
      - run: bun run docs:claims
      - run: bun run docs:runnable
      # Compiling a snippet proves it typechecks; only running it proves the
      # target exists and the recipe terminates. This starts real tmux servers,
      # so it also has to leave none behind, and it says so if it does.
      - run: bun run --cwd packages/libtmux test:readme
      # Compiling the example on every public symbol proved it typechecks and
      # never once ran it; a one-liner that reads a property is still a claim
      # about what that property answers.
      - run: bun run --cwd packages/libtmux test:symbols
      # Every temporary directory the suites create is named for this
      # package, so a sweep can never reap another libtmux port's servers.
      - run: bun run test:namespace
      # dependabot is the one configuration nothing else here executes, so a
      # placeholder in it reads exactly like a working one until a dependency
      # has been stale for a year.
      - run: bun run ci:config

      - name: Gate the library
        working-directory: packages/libtmux
        run: |
          bun run lint:unused
          bun run typecheck
          bun run typecheck:tests
          bun run typecheck:readme
          bun run typecheck:symbols
          bun run docs:api:check
          bun run docs:criteria:check
          bun run generate:check
          bun run capabilities:check
          bun run parity
          bun run build

      # Everything below needs the emitted declarations the build just made:
      # the ambient-free consumer, the fixture that imports the package by
      # name, and the packaging checks.
      - name: Gate the emitted package
        working-directory: packages/libtmux
        run: |
          bun run typecheck:ambient-free
          bun run typecheck:tooling
          bun run test:package
          # Packing and linting the tarball is not installing it. The two
          # releases this repository shipped broken — one with no dist, one
          # whose install command 404'd — both packed clean.
          bun run test:install

      - name: Test the library
        working-directory: packages/libtmux
        run: |
          bun run test:types
          bun run test:node
          # Both suites in one run, because they cover different things: a
          # pane's methods are proven against a real server, so a floor
          # measured on the unit suite alone would push work towards mocking
          # one. This runs them, so `test:unit` is not run separately here.
          bun run test:coverage

      # In-repo consumers prove the published surface is enough to build on.
      # `test:package` runs here and not only at publish: the packaging
      # mistakes this repository actually shipped were in the consumers, and a
      # gate that only runs while releasing finds them after the release.
      - name: Gate the MCP server
        working-directory: packages/mcp
        run: bun run typecheck && bun run test && bun run test:package && bun run test:install

      - name: Gate the workspace builder
        working-directory: packages/workspace
        run: bun run typecheck && bun run test && bun run test:package && bun run test:install

      - name: Gate the workspace CLI
        working-directory: packages/workspace-cli
        run: bun run typecheck && bun run test && bun run test:install

      # The recipes above the library package, reaching across it to the
      # workspace builder and the MCP server. After those gates because each
      # runs from inside the package that owns its document, so an import means
      # what a reader's would — including what those steps just emitted.
      - run: bun run test:docs

      # One step for all of them. Each example is a package of its own now, and
      # the umbrella typechecks and runs every sibling — so adding an example
      # does not mean remembering to add a step here.
      - name: Gate the examples
        working-directory: examples
        run: bun run typecheck && bun run test

  # Every tmux release the package claims to support is proven before it ships:
  # "3.3a or newer" is a claim about 3.5 and 3.6 as much as about the ends, and
  # 3.7 already turned out to be the one release that accepts `break-pane -n`
  # and ignores it. A push runs the two ends; a release runs every one.
  #
  # The CLI also exercises version-sensitive loading, capture and terminal handoff.
  tmux:
    name: tmux (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.tmux != '[]' }}
    runs-on: ${{ needs.plan.outputs.os }}
    # A tmate session needs longer than a test run does.
    timeout-minutes: ${{ matrix.tmate == 'off' && 15 || 60 }}
    # Only the master lane: it tracks tmux's own branch, so a commit upstream
    # must be able to report a regression without failing this repository's
    # checks. Every tagged version stays blocking.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        # The lanes are the plan's. 3.8 is in the table for the layout format:
        # it emits the v2 JSON window_layout and every earlier release the
        # classic string, so the version gate deciding between them has a real
        # binary behind it.
        #
        # master reports `next-X.Y`, which the version ranking treats as a
        # build that has not shipped the release it names -- the one branch of
        # that logic no tagged binary can exercise. It tracks someone else's
        # branch, so it reports without blocking; see `continue-on-error`.
        #
        # 3.8a has no tag upstream: it is released from the `release_3.8a`
        # branch, which the build action reads as a branch.
        include: ${{ fromJSON(needs.plan.outputs.tmux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Point the emitted-Node lane at the provisioned Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      # The oracle runs the real library rather than a description of it, so
      # unlike the parity baseline this needs the code. The tag is what the
      # materialized tree is authenticated against, so a shallow clone of it
      # carries everything the comparison needs.
      - name: Check out libtmux 0.62.0 for the differential oracle
        run: |
          git clone --branch v0.62.0 --depth 1 \
            https://github.com/tmux-python/libtmux.git "$RUNNER_TEMP/libtmux-python"
          echo "LIBTMUX_PYTHON_REPO=$RUNNER_TEMP/libtmux-python" >> "$GITHUB_ENV"

      # The differential corpus compares this port against the pinned Python
      # release, which it runs through uv.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ runner.temp }}/libtmux-python/pyproject.toml
            ${{ runner.temp }}/libtmux-python/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      # Resolve and install the oracle's environment once, here. Left to the
      # suite, the first oracle call pays for it inside a test's deadline and
      # fails on a cold cache while later calls pass on a warm one.
      - name: Warm the oracle environment
        run: uv sync --project "$RUNNER_TEMP/libtmux-python"

      - name: Install the optional workspace Python test runtime
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/workspace-python"
          uv pip install --python "$RUNNER_TEMP/workspace-python/bin/python" 'tmuxp==1.74.0'
          echo "LIBTMUX_TEST_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"
          echo "TMUX_WORKSPACE_PYTHON=$RUNNER_TEMP/workspace-python/bin/python" >> "$GITHUB_ENV"

      # A tag resolves to the same commit forever and a branch does not, so the
      # action keys its cache on the commit rather than the ref. Keyed on the
      # ref alone, `master` would be built once and then served from the cache
      # for good, which is the one thing a master lane exists to avoid.
      - name: Build tmux ${{ matrix.tmux-version }}
        id: tmux
        uses: ./.github/actions/build-tmux
        with:
          ref: ${{ matrix.tmux-version }}

      - name: Open a tmate session before the tests
        if: ${{ matrix.tmate == 'before-tests' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true

      - name: Use tmux ${{ matrix.tmux-version }}
        env:
          TMUX_PREFIX: ${{ steps.tmux.outputs.prefix }}
          TMUX_EXPECT: ${{ matrix.expect }}
        run: |
          echo "$TMUX_PREFIX/bin" >> "$GITHUB_PATH"
          actual_version=$("$TMUX_PREFIX/bin/tmux" -V)
          printf '%s\n' "$actual_version"
          # The expected version is a glob: master reports next-X.Y.
          # shellcheck disable=SC2254
          case "$actual_version" in
            $TMUX_EXPECT) ;;
            *) echo "::error::expected $TMUX_EXPECT, got $actual_version" >&2; exit 1 ;;
          esac

      - run: bun install --frozen-lockfile

      - name: Build the library
        working-directory: packages/libtmux
        run: bun run build

      # What a tmux release can actually change: the commands, the formats, and
      # what the Python oracle says the same call should do.
      - name: Exercise this tmux
        working-directory: packages/libtmux
        run: |
          bun run test:integration
          bun run test:differential

      - name: Exercise the workspace CLI on this tmux
        working-directory: packages/workspace-cli
        run: |
          sudo apt-get install -y fish zsh
          bun run test

      - name: Open a tmate session after a failure
        if: ${{ failure() && matrix.tmate == 'on-failure' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
