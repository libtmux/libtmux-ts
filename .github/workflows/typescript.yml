name: typescript

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, the ceiling, and 3.7 — which sits between them and is the
        # one release that accepts `break-pane -n` and silently ignores it. A
        # matrix of only the ends cannot see a quirk that lives in the middle.
        tmux-version: ["3.2a", "3.7", "3.7b"]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The emitted-Node lane refuses to substitute the runner's default Node,
      # so the floor is provisioned rather than assumed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The differential corpus compares this port against the pinned Python
      # release, which it runs through uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # The oracle runs the real library rather than a description of it, so
      # unlike the parity baseline this needs the code. The tag is what the
      # materialized tree is authenticated against, so a shallow clone of it
      # carries everything the comparison needs.
      - name: Check out libtmux 0.62.0 for the differential oracle
        run: |
          git clone --branch v0.62.0 --depth 1 \
            https://github.com/tmux-python/libtmux.git "$RUNNER_TEMP/libtmux-python"
          echo "LIBTMUX_PYTHON_REPO=$RUNNER_TEMP/libtmux-python" >> "$GITHUB_ENV"

      - name: Point the emitted-Node lane at the provisioned Node 22
        run: echo "LIBTMUX_NODE22=$(which node)" >> "$GITHUB_ENV"

      - name: Setup tmux build cache for tmux ${{ matrix.tmux-version }}
        id: tmux-build-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-builds/tmux-${{ matrix.tmux-version }}
          key: tmux-${{ matrix.tmux-version }}

      - name: Build tmux ${{ matrix.tmux-version }}
        if: steps.tmux-build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt install libevent-dev libncurses5-dev libtinfo-dev libutempter-dev bison
          mkdir -p ~/tmux-builds ~/tmux-src
          git clone https://github.com/tmux/tmux.git ~/tmux-src/tmux-${{ matrix.tmux-version }}
          cd ~/tmux-src/tmux-${{ matrix.tmux-version }}
          git checkout ${{ matrix.tmux-version }}
          sh autogen.sh
          ./configure --prefix=$HOME/tmux-builds/tmux-${{ matrix.tmux-version }} && make && make install

      - name: Use tmux ${{ matrix.tmux-version }}
        run: |
          echo "$HOME/tmux-builds/tmux-${{ matrix.tmux-version }}/bin" >> "$GITHUB_PATH"

      - run: tmux -V

      - run: bun install --frozen-lockfile

      - run: bun run format:check
      - run: bun run lint

      # A package selling zero runtime dependencies has to know what it is
      # carrying: an export nobody imports, a file nothing loads, and a
      # dependency nothing uses all ship anyway unless something asks.
      - run: bun run lint:unused

      - run: bun run typecheck
      - run: bun run typecheck:consumers

      # Documentation is a gate rather than a convention: a snippet nobody
      # compiles is a documented lie about a signature, and a reference nobody
      # regenerates describes the code it was written against instead of the
      # code that ships. These read `src` directly, so they need no build.
      - run: bun run typecheck:readme
      - run: bun run typecheck:symbols
      - run: bun run docs:api:check

      - run: bun run generate:check
      - run: bun run parity
      - run: bun run build

      # A consumer compiles against the emitted declarations without Bun's or
      # Node's ambient types in scope, so the package cannot silently depend on
      # them leaking in from the environment that built it.
      - run: bun run typecheck:ambient-free

      # Compiles a fixture that imports the package by name, which resolves to
      # the emitted declarations, so it has to follow the build.
      - run: bun run typecheck:tooling

      - run: bun run test:types
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run test:differential
      - run: bun run test:node
      - run: bun run test:package
