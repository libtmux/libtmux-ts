name: Build tmux
description: Restore a validated tmux build, or build it, for a release, tag, branch or commit of github.com/tmux/tmux.

inputs:
  ref:
    description: A tmux version, tag, branch or 40-hex commit.
    required: true

outputs:
  prefix:
    description: The directory tmux is installed under; its bin/ holds tmux.
    value: ${{ steps.plan.outputs.prefix }}

runs:
  using: composite
  steps:
    # .github/scripts/tmux_build.py needs Python 3.11 for tomllib, which an
    # older runner image does not ship. update-environment is off so no other
    # step sees this interpreter.
    - name: Set up Python for the tmux build
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        update-environment: false

    # Installed before the key is computed and before a restored build is
    # validated: the key names the versions of these packages.
    - name: Install tmux build and runtime dependencies
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/scripts/apt-get.sh" update
        "$GITHUB_WORKSPACE/scripts/apt-get.sh" install --yes --no-install-recommends \
          autoconf automake bison build-essential libevent-dev \
          libncurses-dev libutempter-dev pkg-config

    # The key holds the runner image and its version, the architecture,
    # compiler and dependency versions, the source (a release's pinned
    # checksum, or the commit a ref resolves to) and the build script. A branch
    # name never serves a stale build, and an image change never serves a build
    # linked against the previous image's libraries.
    - name: Identify tmux ${{ inputs.ref }} source and build environment
      id: plan
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        TMUX_VERSION: ${{ inputs.ref }}
      run: '"$PYTHON" "$GITHUB_WORKSPACE/.github/scripts/tmux_build.py" plan "$TMUX_VERSION"'

    - name: Restore tmux ${{ inputs.ref }}
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}

    - name: Validate or rebuild tmux ${{ inputs.ref }}
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        TMUX_VERSION: ${{ inputs.ref }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: '"$PYTHON" "$GITHUB_WORKSPACE/.github/scripts/tmux_build.py" prepare "$TMUX_VERSION"'

    - name: Save validated tmux ${{ inputs.ref }}
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.prefix }}
        key: ${{ steps.plan.outputs.key }}
