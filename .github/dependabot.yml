# Keep the toolchain and the workflow pins current.
#
# `scripts/check-ci-config.ts` holds this file to the tree: a defined
# ecosystem, a directory holding the manifest it reads, and a bun entry over
# every manifest the root `workspaces` globs resolve to.
version: 2
updates:
  # Every manifest: a package here declares its own dependencies.
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/packages/*"
      - "/examples"
    schedule:
      interval: "weekly"
    # Every bump is to the toolchain, and one pull request runs the gates once
    # rather than five times against five different TypeScripts.
    groups:
      toolchain:
        patterns:
          - "*"
    # The types describe the floor, not the newest Node. `engines.node` is
    # ">=22", so `@types/node` past 22 would let a call compile that the oldest
    # supported runtime cannot make — and the root `overrides` pins it anyway,
    # so a bump here only makes a manifest name a version that does not install.
    # It comes off this list when the floor moves.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
    open-pull-requests-limit: 3
    # The trailing space stops Dependabot appending a colon.
    commit-message:
      prefix: "js(deps) "
