# Keep the toolchain and the workflow pins current.
#
# Two ecosystems, because this repository has two kinds of pin and they rot
# independently: the packages `bun install` resolves, and the actions
# `typescript.yml` and `publish.yml` name by tag.
#
# `scripts/check-ci-config.ts` holds this file to the tree — an ecosystem
# dependabot defines, a directory that has the manifest that ecosystem reads,
# and a bun entry over every manifest the root `workspaces` globs resolve to.
# `packages/*` below covers a new package on its own; what the gate catches is
# a workspace added beside it that this list never learned about.
version: 2
updates:
  # Every manifest, not just the root one: a package here declares its own
  # dependencies, so a bump to the root leaves the others where they were.
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/packages/*"
      - "/examples"
    schedule:
      interval: "weekly"
    # The library ships zero runtime dependencies, so every bump is to the
    # toolchain and they are reviewed together or not at all. One pull request
    # runs the gates once; five run them five times and disagree about which
    # TypeScript compiled the tree.
    groups:
      toolchain:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "repo(chore[deps])"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(chore[actions])"
